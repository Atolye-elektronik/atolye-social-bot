name: Pazaryeri siparis senkronu

on:
  schedule:
    - cron: "13 6-21/2 * * *"   # 2 saatte bir, TR gunduz-aksam araligi
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pazaryeri-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet requests
      - name: Trendyol senkronu
        env:
          TRENDYOL_SUPPLIER_ID: ${{ secrets.TRENDYOL_SUPPLIER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
        working-directory: src/marketplaces
        run: python trendyol_sync.py
      - name: Hepsiburada senkronu
        if: always()
        env:
          HEPSIBURADA_MERCHANT_ID: ${{ secrets.HEPSIBURADA_MERCHANT_ID }}
          HEPSIBURADA_SECRET_KEY: ${{ secrets.HEPSIBURADA_SECRET_KEY }}
          HEPSIBURADA_DEV_USERNAME: ${{ secrets.HEPSIBURADA_DEV_USERNAME }}
          HEPSIBURADA_ENV: ${{ secrets.HEPSIBURADA_ENV }}
        working-directory: src/marketplaces
        run: python hepsiburada_sync.py
      - name: Kaydi commit et
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "atolye-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/
            git commit -m "chore: siparis durumu guncellendi [skip ci]"
            git pull --rebase origin main && git push
          fi
