name: Yeni urun kanca postu

# 09.11.2026: yeni urunler (ESP32 30 pin, LM2596...) sosyal medyaya otomatik
# girmiyordu; kanca carousel'leri elle uretiliyordu. Her sabah son 14 gunde
# eklenen, stokta olan ve henuz postu olmayan urunler icin kanca postu uretilir
# ve takvimdeki ilk bos gune (12:00) yerlestirilir. Paylasimi publish.yml yapar.

on:
  schedule:
    - cron: "30 5 * * *"   # 08:30 TR
  workflow_dispatch:
    inputs:
      gun:
        description: "Kac gun icinde eklenen urunler"
        type: string
        default: "14"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  kanca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Yeni urunler icin kanca postu uret
        run: python -m src.kanca_carousel --yeni "${{ inputs.gun || '14' }}" --count 2
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain posts state/kanca_carousel_seen.json)" ]; then
            git config user.name "atolye-bot"
            git config user.email "bot@users.noreply.github.com"
            git add posts state/kanca_carousel_seen.json
            git commit -q -m "feat: yeni urun kanca postu [skip ci]"
            git pull --rebase --quiet origin main
            git push --quiet
          else
            echo "Yeni urun yok."
          fi
