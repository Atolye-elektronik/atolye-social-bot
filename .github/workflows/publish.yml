name: Sosyal medya paylasimi

on:
  schedule:
    # Iki tur: ogle turu videolari (publish_at 12:00), aksam turu carousel/
    # senaryoyu (19:10) alir. Tek turda ayni platforma 1 gonderi kurali
    # yuzunden video ile carousel yarisip biri ertesi gune kayiyordu.
    - cron: "13 9 * * *"    # 12:13 TR - video turu
    - cron: "47 16 * * *"   # 19:47 TR - carousel/senaryo turu
  workflow_dispatch:
    inputs:
      only:
        description: "Sadece bu postu paylas (dosya adi, .md olmadan)"
        type: string
        default: ""
      force:
        description: "Zaman ve tekrar kontrolunu atla"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ref: main sart — schedule/dispatch olaylari SHA'yi tetiklenme
      # aninda sabitliyor; pespese kosular birbirinin state commit'ini
      # goremeyip ayni postu iki kez paylasabiliyor (20.08 IG cift reel).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet -r requirements.txt
      - name: Postlari paylas
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SKIP_PLATFORMS: "tiktok_studio,pinterest_studio"
          MAX_PER_RUN: "3"
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          RC=0; python -m src.main $ARGS || RC=$?
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Paylasim kaydini commit et
        run: bash tools/state_it.sh "paylasim kaydi guncellendi"
      - name: Sonuc
        run: exit ${RC:-0}
