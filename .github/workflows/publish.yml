name: Sosyal medya paylasimi

on:
  schedule:
    - cron: "47 16 * * *"   # 19:47 TR - kalabalik dakikalardan kacinmak icin tuhaf dakika
  workflow_dispatch:
    inputs:
      only:
        description: "Sadece bu postu paylas (dosya adi, .md olmadan)"
        type: string
        default: ""
      force:
        description: "Zaman ve tekrar kontrolunu atla"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet -r requirements.txt
      - name: Postlari paylas
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SKIP_PLATFORMS: "tiktok_studio,pinterest_studio"
          MAX_PER_RUN: "3"
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          RC=0; python -m src.main $ARGS || RC=$?
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Paylasim kaydini commit et
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "atolye-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/
            git commit -m "chore: paylasim kaydi guncellendi [skip ci]"
            git pull --rebase origin main && git push
          else
            echo "Kayitta degisiklik yok."
          fi
      - name: Sonuc
        run: exit ${RC:-0}
