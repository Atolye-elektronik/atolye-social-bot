name: Trendyol Urun Ekleme

# Bilerek SADECE elle calistirilir — gonder secenegi Trendyol'da gercek urun acar.
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "Ne yapilsin?"
        type: choice
        required: true
        default: "kesfet"
        options: [kesfet, kuru, gonder, guncelle, batch, onaysiz, stok, not-ekle, fiyatdok, zam, zamduzelt, test70, test70geri, buzzerunlock]
      batch_id:
        description: "batch icin batchRequestId"
        type: string
        default: ""
      sku:
        description: "gonder icin virgullu stok kodu listesi (bos = hepsi)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  urun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Calistir
        env:
          TRENDYOL_SUPPLIER_ID: ${{ secrets.TRENDYOL_SUPPLIER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          PYTHONIOENCODING: utf-8
        run: |
          case "${{ inputs.islem }}" in
            kesfet) python src/marketplaces/trendyol_urun_ekle.py --kesfet ${{ inputs.sku && format('--kategori "{0}"', inputs.sku) || '' }} ;;
            kuru)   python src/marketplaces/trendyol_urun_ekle.py --kuru ;;
            gonder) python src/marketplaces/trendyol_urun_ekle.py --gonder ${{ inputs.sku && format('--sku "{0}"', inputs.sku) || '' }} ;;
            batch)  python src/marketplaces/trendyol_urun_ekle.py --batch "${{ inputs.batch_id }}" ;;
            onaysiz) python src/marketplaces/trendyol_urun_ekle.py --onaysiz ;;
            fiyatdok) python src/marketplaces/trendyol_urun_ekle.py --fiyat-dok ;;
            zam) python src/marketplaces/trendyol_urun_ekle.py --zam "5" --zam-tl "AETCS18P=100" ;;
            zamduzelt) python src/marketplaces/trendyol_urun_ekle.py --zam "0" --zam-tl "AETC162=79" --sku "AETC162" ;;
            test70) python src/marketplaces/trendyol_urun_ekle.py --zam "0" --zam-tl "AETP4056=70,AEBZZR5V=70,AEPYAA2=70,AEPY18650=70,AEPOT10K=70" --sku "AETP4056,AEBZZR5V,AEPYAA2,AEPY18650,AEPOT10K" ;;
            test70geri) python src/marketplaces/trendyol_urun_ekle.py --fiyat-set "TYB1FWMHAXR7W1GI43=77,TYBPT2Q0O7Y1KGYG90=20,TYBW805DFS3U8DIC36=21,TYBRAWXK3UZY5HUP72=45,AB0281=78,9999880000034=21,9999880000047=25" ;;
            buzzerunlock) python src/marketplaces/trendyol_urun_ekle.py --fiyat-set "${{ inputs.sku }}" ;;
            stok) python src/marketplaces/trendyol_urun_ekle.py --stok ;;
            not-ekle) python src/marketplaces/trendyol_urun_ekle.py --not-ekle "${{ inputs.sku }}" ;;
            guncelle) python src/marketplaces/trendyol_urun_ekle.py --gonder --guncelle ${{ inputs.sku && format('--sku "{0}"', inputs.sku) || '' }} ;;
          esac
      - name: Kaydi commit et
        if: inputs.islem == 'gonder'
        run: bash tools/state_it.sh "trendyol yeni urun kaydi"
