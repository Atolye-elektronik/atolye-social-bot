name: Telegram gunluk ozet

# 27.09.2026 (kullanici talebi): Telegram'a giden TEK iki mesaj bunlar.
#   14:00 TR -> o an kargoya verilmemis TUM siparisler
#   23:55 TR -> gunun tum siparisleri, toplam ciro olarak
# Siparis basina anlik bildirim ve Pazartesi karnesi KAPATILDI ("cok fazla
# bildirim geliyor"). Runner UTC: 14:00 TR = 11:00 UTC, 23:55 TR = 20:55 UTC.

on:
  schedule:
    - cron: "0 11 * * *"    # 14:00 TR -> kargoya verilmemis siparisler
    - cron: "55 20 * * *"   # 23:55 TR -> gunun cirosu
  workflow_dispatch:
    inputs:
      rapor:
        description: "kargo | ciro"
        type: choice
        options: [kargo, ciro]
        default: kargo

jobs:
  ozet:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: src:src/marketplaces
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}          # Dev Dashboard "Stok merkezi" -> client credentials grant
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
      TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
      TRENDYOL_SUPPLIER_ID: ${{ secrets.TRENDYOL_SUPPLIER_ID }}
      HEPSIBURADA_MERCHANT_ID: ${{ secrets.HEPSIBURADA_MERCHANT_ID }}
      HEPSIBURADA_SECRET_KEY: ${{ secrets.HEPSIBURADA_SECRET_KEY }}
      HEPSIBURADA_DEV_USERNAME: ${{ secrets.HEPSIBURADA_DEV_USERNAME }}
      HEPSIBURADA_ENV: ${{ secrets.HEPSIBURADA_ENV }}
      N11_API_KEY: ${{ secrets.N11_API_KEY }}
      N11_API_SECRET: ${{ secrets.N11_API_SECRET }}
      PAZARAMA_API_KEY: ${{ secrets.PAZARAMA_API_KEY }}
      PAZARAMA_SECRET_KEY: ${{ secrets.PAZARAMA_SECRET_KEY }}
      PTTAVM_API_KEY: ${{ secrets.PTTAVM_API_KEY }}
      PTTAVM_ACCESS_TOKEN: ${{ secrets.PTTAVM_ACCESS_TOKEN }}
      IDEFIX_API_KEY: ${{ secrets.IDEFIX_API_KEY }}
      IDEFIX_SECRET: ${{ secrets.IDEFIX_SECRET }}
      IDEFIX_SATICI_ID: ${{ secrets.IDEFIX_SATICI_ID }}
      AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
      AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
      AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
      AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
      AMAZON_MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
      AMAZON_SPAPI_ENDPOINT: ${{ secrets.AMAZON_SPAPI_ENDPOINT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STOK_SHEET_WEBHOOK: ${{ secrets.STOK_SHEET_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet -r requirements.txt
      - name: Ozeti gonder
        run: |
          RAPOR="${{ inputs.rapor }}"
          if [ -z "$RAPOR" ]; then
            if [ "${{ github.event.schedule }}" = "55 20 * * *" ]; then RAPOR=ciro; else RAPOR=kargo; fi
          fi
          echo "rapor=$RAPOR"
          python tools/telegram_ozet.py "--$RAPOR"
