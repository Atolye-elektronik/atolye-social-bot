name: İçerik takviminden post üret

on:
  # Her pazar 06:00 UTC (Türkiye 09:00) — gelecek haftanın taslaklarını hazırlar.
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Kaç gün ileri bakılsın"
        type: string
        default: "7"
      dry_run:
        description: "Sadece dene, dosya yazma"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  takvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taslakları üret
        run: |
          ARGS="--days ${{ inputs.days || '7' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.calendar_source $ARGS

      - name: Pull request aç
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: içerik takviminden yeni post taslakları"
          branch: takvim-taslaklari
          delete-branch: true
          title: "İçerik takvimi — yeni post taslakları"
          body: |
            `content/takvim.json` dosyasındaki haftalık plana göre üretildi.
            Metinleri ve tarihleri düzenleyip birleştirebilirsin.
          add-paths: |
            posts/
            state/
