name: IG gunluk hikayeler

on:
  schedule:
    - cron: "41 17 * * *"   # 20:41 TR
  workflow_dispatch:
    inputs:
      hikayeler:
        description: "Elle: virgullu hazir gorsel adlari (bos = taze uretim)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  hikaye:
    runs-on: ubuntu-latest
    steps:
      # ref: main sart — schedule/dispatch olaylari SHA'yi tetiklenme
      # aninda sabitliyor; pespese kosular birbirinin state commit'ini
      # goremeyip ayni postu iki kez paylasabiliyor (20.08 IG cift reel).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet -r requirements.txt
      # Instagram gorseli herkese acik URL'den ceker; bu yuzden once uret,
      # commit'le (raw URL dogsun), SONRA yayinla (20.08 dersi).
      - name: Gorselleri uret
        if: ${{ inputs.hikayeler == '' }}
        run: python -m src.hikaye_uret --evre uret --adet 2
      - name: Gorselleri depoya it
        if: ${{ inputs.hikayeler == '' }}
        run: |
          git config user.name "atolye-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/media/hikaye/gunluk
          git diff --staged --quiet || git commit -m "chore: gunun hikaye gorselleri [skip ci]"
          git pull --rebase origin main && git push
      - name: Yayinla
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          HIKAYELER: ${{ inputs.hikayeler }}
        run: |
          if [ -n "$HIKAYELER" ]; then
            for ad in $(echo "$HIKAYELER" | tr ',' ' '); do
              python -c "from src import instagram; print('yayinlandi:', instagram.hikaye_yayinla('posts/media/hikaye/hikaye-${ad}.png'))"
            done
          else
            python -m src.hikaye_uret --evre yayinla
          fi
      - name: Hikaye kaydini commit et
        run: bash tools/state_it.sh "hikaye kaydi guncellendi"