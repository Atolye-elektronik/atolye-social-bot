name: IG gunluk hikayeler

on:
  schedule:
    - cron: "41 17 * * *"   # 21:00 TR
  workflow_dispatch:
    inputs:
      hikayeler:
        description: "Elle: virgullu hazir gorsel adlari (bos = taze uretim)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  hikaye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet -r requirements.txt
      - name: Hikayeleri uret ve yayinla
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          HIKAYELER: ${{ inputs.hikayeler }}
        run: |
          if [ -n "$HIKAYELER" ]; then
            for ad in $(echo "$HIKAYELER" | tr ',' ' '); do
              python -c "from src import instagram; print('yayinlandi:', instagram.hikaye_yayinla('posts/media/hikaye/hikaye-${ad}.png'))"
            done
          else
            python -m src.hikaye_uret --adet 2
          fi
      - name: Hikaye kaydini commit et
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "atolye-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/
            git commit -m "chore: hikaye kaydi guncellendi [skip ci]"
            git pull --rebase origin main && git push
          fi
