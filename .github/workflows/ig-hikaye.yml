name: IG gunluk hikaye gorselleri (uretim)

on:
  schedule:
    - cron: "41 17 * * *"   # 20:41 TR
  workflow_dispatch:
    inputs:
      hikayeler:
        description: "Elle: virgullu hazir gorsel adlari (bos = taze uretim)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  hikaye:
    runs-on: ubuntu-latest
    steps:
      # ref: main sart — schedule/dispatch olaylari SHA'yi tetiklenme
      # aninda sabitliyor; pespese kosular birbirinin state commit'ini
      # goremeyip ayni postu iki kez paylasabiliyor (20.08 IG cift reel).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: pip install --quiet -r requirements.txt
      # 21.08: hikayeleri kullanici kendisi paylasiyor (link etiketi API ile
      # eklenemiyor). Is yalnizca gorselleri uretip repoya koyar.
      - name: Gorselleri uret
        if: ${{ inputs.hikayeler == '' }}
        run: python -m src.hikaye_uret --evre uret --adet 2
      # Not: yayin adimi yok — gorseller kullaniciya gonderiliyor (link etiketi icin)
      - name: Gorselleri depoya it
        if: ${{ inputs.hikayeler == '' }}
        run: |
          git config user.name "atolye-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/media/hikaye/gunluk
          git diff --staged --quiet || git commit -m "chore: gunun hikaye gorselleri [skip ci]"
          git pull --rebase origin main && git push
      - name: Hikaye kaydini commit et
        run: bash tools/state_it.sh "hikaye kaydi guncellendi"