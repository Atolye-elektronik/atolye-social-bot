name: Pinterest gunluk pin

on:
  schedule:
    - cron: "37 18 * * *"   # 21:37 TR
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ref: main sart — schedule/dispatch olaylari SHA'yi tetiklenme
      # aninda sabitliyor; pespese kosular birbirinin state commit'ini
      # goremeyip ayni postu iki kez paylasabiliyor (20.08 IG cift reel).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklari kur
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pin at
        env:
          PYTHONUNBUFFERED: "1"
          PINTEREST_STUDIO_COOKIES: ${{ secrets.PINTEREST_STUDIO_COOKIES }}
          PINTEREST_BOARD_ID: "Ürünlerimiz"
          SKIP_PLATFORMS: "instagram,facebook,threads,tiktok,tiktok_studio,youtube,pinterest"
          MAX_PER_RUN: "3"
        run: |
          RC=0; python -m src.main || RC=$?
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Kaydi commit et
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "atolye-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/
            git commit -m "chore: pinterest kaydi guncellendi [skip ci]"
            git pull --rebase origin main && git push
          fi
      - name: Hata dokumlerini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-studio-dokum
          path: logs/pinterest-studio/
          retention-days: 7
      - name: Sonuc
        run: exit ${RC:-0}
