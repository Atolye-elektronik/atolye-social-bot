name: Hepsiburada Sipariş Senkronizasyonu

on:
  schedule:
    # Her saat başı 27. dakikada (Trendyol 13'te çalışıyor, çakışmasın)
    - cron: "27 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Hepsiburada sync
        env:
          HEPSIBURADA_MERCHANT_ID: ${{ secrets.HEPSIBURADA_MERCHANT_ID }}
          HEPSIBURADA_SECRET_KEY: ${{ secrets.HEPSIBURADA_SECRET_KEY }}
          HEPSIBURADA_DEV_USERNAME: ${{ secrets.HEPSIBURADA_DEV_USERNAME }}
          HEPSIBURADA_ENV: ${{ vars.HEPSIBURADA_ENV || 'prod' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: src/marketplaces
        run: python hepsiburada_sync.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/hepsiburada_orders.json
          git diff --staged --quiet || git commit -m "chore: hepsiburada sipariş durumu güncellendi"
          git pull --rebase origin main || true
          git push
