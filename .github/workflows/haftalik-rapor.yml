name: Haftalik satis raporu

on:
  schedule:
    - cron: "30 4 * * 1"   # Pazartesi 07:30 TR
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Raporu olustur
        env:
          TRENDYOL_SUPPLIER_ID: ${{ secrets.TRENDYOL_SUPPLIER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: src/marketplaces
        run: python haftalik_rapor.py
