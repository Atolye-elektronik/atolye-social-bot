<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• DS1302: DAT→D4, CLK→D5, RST→D2 (ThreeWire(4,5,2)).</text><text x="1110" y="767" font-size="16.5" fill="#14213d">• LCD SDA→A4, SCL→A5. Modüller 5V'tan beslenir; GND</text><text x="1110" y="792" font-size="16.5" fill="#14213d">   ortak.</text><text x="1110" y="817" font-size="16.5" fill="#14213d">• Kütüphaneler: Rtc by Makuna, LiquidCrystal I2C.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• İlk yüklemede kod bilgisayar saatini RTC'ye aktarır.</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• RTC üzerindeki CR2032 pil takılı olmalı.</text>
