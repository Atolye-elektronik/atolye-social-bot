<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• Araç: kırmızı→D2, sarı (RGB R+G)→D3+D4, yeşil→D5.</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   Yaya: kırmızı→D6, yeşil→D7.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• Her LED 330 Ω dirençle seri; RGB LED'in en uzun</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   bacağı GND (ortak katot).</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Buton D8 ile GND arasında (INPUT_PULLUP, direnç</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   gerekmez).</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Buzzer (+)→D9: yaya geçişinde sesli uyarı.</text><text x="1110" y="917" font-size="16.5" fill="#14213d">• Nano breadboard'un ortasına, iki yarıya basacak</text><text x="1110" y="942" font-size="16.5" fill="#14213d">   şekilde takılır.</text>
