<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• RC522: SDA→D10, SCK→D13, MOSI→D11, MISO→D12, RST→D9;</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   3.3V ile beslenir!</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• LCD SDA→A4, SCL→A5. Servo→D6.</text><text x="1110" y="817" font-size="16.5" fill="#14213d">• Buzzer (+)→D5; yeşil LED→D3, kırmızı LED→D4 (330 Ω</text><text x="1110" y="842" font-size="16.5" fill="#14213d">   ile).</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• Kart UID'lerini Seri Monitör'den okuyup koddaki</text><text x="1110" y="892" font-size="16.5" fill="#14213d">   listeye isimle yazın.</text><text x="1110" y="917" font-size="16.5" fill="#14213d">• Kütüphaneler: MFRC522, LiquidCrystal I2C, Servo.</text>
