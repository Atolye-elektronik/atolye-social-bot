<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• DHT11 DATA→D7; LCD SDA→A4, SCL→A5; Röle IN→D8.</text><text x="1110" y="767" font-size="16.5" fill="#14213d">• Fan devresi: pil + → röle COM, röle NO → motor,</text><text x="1110" y="792" font-size="16.5" fill="#14213d">   motor diğer ucu → pil −.</text><text x="1110" y="817" font-size="16.5" fill="#14213d">• Sıcaklık eşiği kodda (varsayılan 28 °C)</text><text x="1110" y="842" font-size="16.5" fill="#14213d">   değiştirilebilir.</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• LCD adresi 0x27 değilse 0x3F deneyin.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Kütüphaneler: DHT sensor library, LiquidCrystal I2C.</text><text x="1110" y="917" font-size="16.5" fill="#14213d">   Piller dahil değildir.</text>
