<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• DHT11 DATA→G4; LCD SDA→G21, SCL→G22; Buzzer (+)→G25.</text><text x="1110" y="767" font-size="16.5" fill="#14213d">• LDR gerilim bölücü: 3V3→LDR→G34→10 kΩ→GND (orta</text><text x="1110" y="792" font-size="16.5" fill="#14213d">   nokta G34).</text><text x="1110" y="817" font-size="16.5" fill="#14213d">• LCD VIN'den (5V), DHT11 ve LDR 3V3'ten beslenir.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• LCD adresi 0x27 değilse 0x3F deneyin; yazı soluksa</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   arkadaki mavi trimpotu çevirin.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Telefon: 'AtolyeHava' ağına bağlan (şifre 12345678),</text><text x="1110" y="917" font-size="16.5" fill="#14213d">   tarayıcıda 192.168.4.1.</text>
