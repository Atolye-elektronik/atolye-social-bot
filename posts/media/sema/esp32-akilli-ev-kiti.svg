<text x="1110" y="742" font-size="16.5" fill="#14213d">• Röle 1 IN→G26, Röle 2 IN→G27; DHT11 DATA→G4; PIR</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   OUT→G34.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• Buzzer (+)→G25. LED'ler 330 Ω ile: kırmızı G18,</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   yeşil G19, mavi G21.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Röle ve PIR VIN'den (USB 5V), DHT11 3V3'ten</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   beslenir.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Telefon: 'AtolyeEv' ağına bağlan (şifre 12345678),</text><text x="1110" y="917" font-size="16.5" fill="#14213d">   tarayıcıda 192.168.4.1.</text><text x="1110" y="942" font-size="16.5" fill="#14213d">• Röle çıkışına 220 V bağlantı yalnız eğitmen</text><text x="1110" y="967" font-size="16.5" fill="#14213d">   gözetiminde.</text>
