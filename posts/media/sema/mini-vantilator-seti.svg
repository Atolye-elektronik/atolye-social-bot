<text x="50" y="58" font-size="40" font-weight="800" fill="#14213d">Mini Vantilatör Seti — Bağlantı Şeması</text>
<text x="50" y="92" font-size="21" fill="#5c6672">2'li AA Pil Kutusu + On-Off Anahtar + 3V DC Motor + Pervane — lehim gerektirmez</text>
<text x="1550" y="52" text-anchor="end" font-size="22" font-weight="800" fill="#c8102e">ATÖLYE ELEKTRONİK</text>
<text x="1550" y="84" text-anchor="end" font-size="18" fill="#5c6672">Model: AEVANTSET · atolyeelektronik.com</text>
<rect x="120" y="380" width="220" height="180" rx="12" fill="#2b2f36"/><rect x="142" y="400.0" width="176" height="64.0" rx="8" fill="#3d7a4a"/><text x="230.0" y="439.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">AA 1.5V</text><rect x="142" y="474.0" width="176" height="64.0" rx="8" fill="#3d7a4a"/><text x="230.0" y="513.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">AA 1.5V</text><text x="156" y="372" font-size="22" font-weight="700" fill="#e53935">+</text><text x="304" y="584" font-size="22" font-weight="700" fill="#1a1a1a">−</text><text x="230.0" y="590" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">2'li AA Pil Kutusu = 3V</text><rect x="440" y="250" width="150" height="90" rx="14" fill="#2b2f36"/><text x="515.0" y="287.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">ANAHTAR</text><text x="515.0" y="319.0" text-anchor="middle" font-size="20" fill="#cfd8e3">on / off</text><text x="454" y="302.0" font-size="21" font-weight="700" fill="#fff"></text><circle cx="440" cy="295.0" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="576" y="302.0" text-anchor="end" font-size="21" font-weight="700" fill="#fff"> </text><circle cx="590" cy="295.0" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><path d="M 156 380 L 156 295 L 440 295" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="440" cy="295" r="7" fill="#e53935"/><rect x="1150" y="230" width="220" height="110" rx="14" fill="#1f2a44"/><text x="1260.0" y="277.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">DC MOTOR</text><text x="1260.0" y="309.0" text-anchor="middle" font-size="20" fill="#cfd8e3">3V yassı + pervane</text><text x="1164" y="275.5" font-size="21" font-weight="700" fill="#fff"></text><circle cx="1150" cy="268.5" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="1164" y="308.5" font-size="21" font-weight="700" fill="#fff"> </text><circle cx="1150" cy="301.5" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><circle cx="1420" cy="285" r="40" fill="#e53935"/><circle cx="1420" cy="285" r="12" fill="#b71c1c"/><path d="M 590 295 L 900 295 L 900 268.5 L 1150 268.5" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1150" cy="268.5" r="7" fill="#e53935"/><path d="M 1150 301.5 L 1100 301.5 L 1100 760 L 304 760 L 304 560" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1150" cy="301.5" r="7" fill="#1a1a1a"/><text x="60" y="660" text-anchor="start" font-size="17" font-weight="500" fill="#5c6672">Pil kutusu: kırmızı kablo = +, siyah kablo = −</text>
<rect x="1090" y="680" width="490" height="227" rx="12" fill="#fff" stroke="#cfd8e3"/>
<rect x="1090" y="680" width="490" height="42" rx="12" fill="#14213d"/><rect x="1090" y="700" width="490" height="22" fill="#14213d"/>
<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• Pil + (kırmızı) → anahtar → motor; motor diğer ucu →</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   pil − (siyah).</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• Kablo uçları motor bacaklarına sarılır ya da</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   bantlanır.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Pervane motor miline bastırarak takılır.</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• Motor ters dönerse iki kabloyu yer değiştirin.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Piller dahil değildir (2 x AA).</text>
</svg>