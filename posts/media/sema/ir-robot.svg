<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• Kod pinleri: IN1→D5, IN2→D6, IN3→D9, IN4→D10, IR</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   alıcı OUT→D11.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• Arduino, pilden VIN pini ile beslenir (7.4V; VIN</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   7-12V kabul eder). 5V pinine güç verilmez.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• ENA, ENB ve 5V jumper'ları takılı kalmalı.</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• Arduino ile L298N'in GND'leri mutlaka ortak olmalı.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Kod yüklerken pil şalterini kapatın.</text><text x="1110" y="917" font-size="16.5" fill="#14213d">• Motor ters dönerse OUT uçlarını yer değiştirin.</text><text x="1110" y="942" font-size="16.5" fill="#14213d">• Arduino IDE'de IRremote kütüphanesi kurulmalıdır.</text>
