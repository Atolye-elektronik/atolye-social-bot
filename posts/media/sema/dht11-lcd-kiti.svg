<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• DHT11 DATA→D7; LCD SDA→A4, SCL→A5 (I2C).</text><text x="1110" y="767" font-size="16.5" fill="#14213d">• DHT11 ve LCD 5V'tan beslenir; GND ortak.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• LCD adresi 0x27 değilse 0x3F deneyin (I2C tarama</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   kodu).</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Kütüphaneler: DHT sensor library (Adafruit),</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   LiquidCrystal I2C.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Ekran boşsa arka yüzdeki kontrast potunu çevirin.</text>
