<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• RC522: SDA(SS)→D10, SCK→D13, MOSI→D11, MISO→D12,</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   RST→D9.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• RC522 3.3V ile beslenir (5V'a bağlamayın!). GND</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   ortak.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Servo sinyal→D6, kırmızı→5V, kahverengi→GND.</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• Kütüphaneler: MFRC522, Servo. Kart UID'sini Seri</text><text x="1110" y="892" font-size="16.5" fill="#14213d">   Monitör'den okuyup koda yazın.</text><text x="1110" y="917" font-size="16.5" fill="#14213d">• IRQ pini boş kalır.</text>
