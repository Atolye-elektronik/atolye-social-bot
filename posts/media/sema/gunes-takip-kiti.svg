<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• Her LDR 10 kΩ dirençle gerilim bölücü: LDR 5V'a,</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   direnç GND'ye, orta nokta analog pine.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• LDR: sol üst→A0, sağ üst→A1, sol alt→A2, sağ alt→A3.</text><text x="1110" y="817" font-size="16.5" fill="#14213d">• Yatay servo→D9, dikey servo→D10.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• LDR'ler artı şeklinde bir ayırıcıyla (karton)</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   birbirinden ayrılmalı.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• İki servo birlikte zorlanırsa Arduino'yu adaptörle</text><text x="1110" y="917" font-size="16.5" fill="#14213d">   besleyin.</text>
