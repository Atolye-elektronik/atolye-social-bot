<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• ULN2003: IN1→D8, IN2→D9, IN3→D10, IN4→D11.</text><text x="1110" y="767" font-size="16.5" fill="#14213d">• Kodda Stepper(2048, 8, 10, 9, 11) sırası ULN2003</text><text x="1110" y="792" font-size="16.5" fill="#14213d">   için doğrudur.</text><text x="1110" y="817" font-size="16.5" fill="#14213d">• Sürücü 5V ve GND Arduino'dan; motor 5 pinli soketle</text><text x="1110" y="842" font-size="16.5" fill="#14213d">   sürücüye takılır.</text><text x="1110" y="867" font-size="16.5" fill="#14213d">• Uzun süreli kullanımda sürücüyü harici 5V adaptörle</text><text x="1110" y="892" font-size="16.5" fill="#14213d">   besleyin (GND ortak).</text><text x="1110" y="917" font-size="16.5" fill="#14213d">• Stepper kütüphanesi IDE ile gelir.</text>
