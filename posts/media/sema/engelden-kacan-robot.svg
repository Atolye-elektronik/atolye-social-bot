"/><circle cx="940" cy="590" r="7" fill="#1a1a1a"/><path d="M 450 660 L 450 905" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="450" cy="905" r="7" fill="#1a1a1a"/><circle cx="940" cy="905" r="7" fill="#1a1a1a"/><text x="60" y="913" text-anchor="start" font-size="22" font-weight="700" fill="#14213d">GND</text><text x="850" y="945" text-anchor="middle" font-size="19" font-weight="700" fill="#14213d">ORTAK GND HATTI</text><rect x="30" y="290" width="190" height="140" rx="14" fill="#1f2a44"/><text x="48" y="352.0" text-anchor="start" font-size="22" font-weight="700" fill="#fff">HC-SR04</text><text x="48" y="384.0" text-anchor="start" font-size="20" fill="#cfd8e3">Ultrasonik</text><text x="206" y="325.0" text-anchor="end" font-size="21" font-weight="700" fill="#fff">VCC</text><circle cx="220" cy="318.0" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="206" y="360.0" text-anchor="end" font-size="21" font-weight="700" fill="#fff">TRIG</text><circle cx="220" cy="353.0" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="206" y="395.0" text-anchor="end" font-size="21" font-weight="700" fill="#fff">ECHO</text><circle cx="220" cy="388.0" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="172.5" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">GND</text><circle cx="172.5" cy="290" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><rect x="30" y="520" width="190" height="120" rx="14" fill="#1f2a44"/><text x="48" y="572.0" text-anchor="start" font-size="24" font-weight="700" fill="#fff">SG90</text><text x="48" y="604.0" text-anchor="start" font-size="20" fill="#cfd8e3">Servo</text><text x="206" y="563.0" text-anchor="end" font-size="21" font-weight="700" fill="#fff">SIG</text><circle cx="220" cy="556.0" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="206" y="593.0" text-anchor="end" font-size="21" font-weight="700" fill="#fff">5V</text><circle