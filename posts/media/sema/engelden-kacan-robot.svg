<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• Kod pinleri: IN1→D5, IN2→D6, IN3→D9, IN4→D10;</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   TRIG→A0, ECHO→A1; Servo→D3.</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• HC-SR04 ve servo, L298N'in 5V çıkışından beslenir</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   (Arduino regülatörü yorulmaz); GND ortak.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Servo sinyal kablosu (turuncu) D3'e, kırmızı 5V'a,</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   kahverengi GND'ye.</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Arduino pilden VIN ile beslenir (7.4V). 5V pinine</text><text x="1110" y="917" font-size="16.5" fill="#14213d">   güç verilmez.</text><text x="1110" y="942" font-size="16.5" fill="#14213d">• ENA, ENB ve L298N 5V jumper'ları takılı kalmalı.</text><text x="1110" y="967" font-size="16.5" fill="#14213d">• Kod yüklerken pil şalterini kapatın; motor ters</text><text x="1110" y="992" font-size="16.5" fill="#14213d">   dönerse OUT uçlarını değiştirin.</text>
