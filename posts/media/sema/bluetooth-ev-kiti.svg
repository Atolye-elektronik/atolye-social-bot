<text x="1108" y="709" font-size="22" font-weight="700" fill="#fff">Önemli Notlar</text>
<text x="1110" y="742" font-size="16.5" fill="#14213d">• HC-06 TXD→D2, RXD→D3 (SoftwareSerial; kod yüklerken</text><text x="1110" y="767" font-size="16.5" fill="#14213d">   modülü sökmeye gerek yok).</text><text x="1110" y="792" font-size="16.5" fill="#14213d">• Röle 1 IN→D7, Röle 2 IN→D8. LED'ler 330 Ω ile: D4,</text><text x="1110" y="817" font-size="16.5" fill="#14213d">   D5, D6.</text><text x="1110" y="842" font-size="16.5" fill="#14213d">• Telefonda Bluetooth terminal uygulamasıyla eşleşin</text><text x="1110" y="867" font-size="16.5" fill="#14213d">   (şifre 1234 / 0000).</text><text x="1110" y="892" font-size="16.5" fill="#14213d">• Komutlar kodda: 1/0 röle 1, 2/3 röle 2, K/Y/M</text><text x="1110" y="917" font-size="16.5" fill="#14213d">   LED'ler.</text><text x="1110" y="942" font-size="16.5" fill="#14213d">• Röle çıkışına 220 V bağlantı yalnız eğitmen</text><text x="1110" y="967" font-size="16.5" fill="#14213d">   gözetiminde.</text>
